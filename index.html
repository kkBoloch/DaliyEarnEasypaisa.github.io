<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>Ramzan Package Reward</title>
<style>
body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
padding:40px;
}
.box{
background:white;
padding:30px;
border-radius:10px;
width:320px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h2{
color:#0a7d3b;
}
input,select{
width:90%;
padding:10px;
margin:10px;
border:1px solid #ccc;
border-radius:5px;
}
button{
background:#0a7d3b;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
}
#msg{
margin-top:15px;
color:green;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h2>Ramzan Package Reward</h2>

<input type="text" placeholder="Apna Mobile Number Enter Karein">

<select>
<option>Select Payment Method</option>
<option>Easypaisa</option>
<option>JazzCash</option>
</select>

<br>
<button onclick="apply()">Submit</button>

<p id="msg"></p>
</div>

<script>
function apply(){
document.getElementById("msg").innerHTML =
"Apka Apply hogya hai. Apko 24 hours me 16500 Rs Receive ho jayega. Shukariya!";
}
</script>

</body>
</html>
